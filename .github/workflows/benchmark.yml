name: Benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.repository }}

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: true

      # For jshrink
      - name: Setup Composer
        uses: php-actions/composer@v6
        with:
          working_dir: packages/minifiers

      # For Google Closure Compiler
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Benchmark
        run: pnpm bench-all

      - name: Update README
        run: pnpm update-readme
        env:
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}

      - name: Commit README.md
        run: |
          # Ignored by Renovate
          git config user.name "minification-benchmarks automation"
          git config user.email actions@users.noreply.github.com
          git add README.md packages/data/data/data.json
          git diff-index --quiet HEAD || git commit -nm "chore: update benchmark results"
          git push

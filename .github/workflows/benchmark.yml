name: Benchmark

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Declaring id-token resets every unlisted permission to none, so contents
    # must be listed explicitly
    permissions:
      # Pushes the benchmark results and report commits
      contents: write
      # Exchanges a GitHub OIDC token for a short-lived OpenCode API token
      id-token: write

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.repository }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: |
            args: [--frozen-lockfile]

      # For jshrink
      - name: Setup Composer
        uses: php-actions/composer@v6
        with:
          working_dir: packages/minifiers

      # For Google Closure Compiler
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Git
        run: |
          git config user.name "minification-benchmarks automation"
          # Keep in sync with "gitIgnoredAuthors" in renovate.json: Renovate matches
          # commits by author email and force-pushes away any it doesn't recognize
          # as automation
          git config user.email github-actions@github.com

      # Renovate recreates its branches from the base branch, discarding the
      # generated results commit. Cache data.json so the benchmark only re-runs
      # measurements whose inputs changed.
      - name: Restore benchmark results
        id: benchmark-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/data/data/data.json
          key: benchmark-${{ hashFiles('pnpm-lock.yaml', 'packages/minifiers/composer.lock', 'packages/data/data/data.json') }}

      - name: Benchmark
        run: pnpm bench-all

      # Save before committing so the results survive failures in the
      # commit or report steps
      - name: Save benchmark results
        if: steps.benchmark-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/data/data/data.json
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}

      - name: Commit benchmark results
        run: |
          # Ignored by Renovate
          git add packages/data/data/data.json
          if ! git diff --cached --quiet; then
            # [skip ci] so the generated commits don't trigger approval-required runs
            git commit -nm "chore: update benchmark results [skip ci]"
            git push
          fi

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          set -o pipefail
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_1ab1e997-cddd-4a71-8a85-13a6490c9f1e \
            -d subject_token="$oidc" | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = null ]; then
            echo "::error::OpenCode token exchange returned no access token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "OPENCODE_GO_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Update README
        run: pnpm update-readme

      - name: Commit benchmark report
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -nm "docs: update benchmark report [skip ci]"
            git push
          fi
